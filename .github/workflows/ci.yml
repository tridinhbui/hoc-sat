name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Quan trọng nhất: D1 không có RLS, bộ test này là hàng rào duy nhất
      # còn lại. PR nào làm đỏ nó thì không được merge.
      - name: Test phân quyền
        run: npm test

      # `build:cf` chạy `next build` bên trong rồi mới bundle cho workerd,
      # nên đây là gate duy nhất cần chạy. Next build xanh không có nghĩa là
      # chạy được trên Workers — bundle cho workerd có ràng buộc riêng.
      - name: Build cho Cloudflare Workers
        run: npm run build:cf
